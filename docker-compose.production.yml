x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: chuyu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chuyu
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: member_platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chuyu -d member_platform']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  api:
    image: ${COMPOSE_PROJECT_NAME:-chuyu-app}-api
    build: .
    container_name: chuyu-api
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      API_PORT: 3000
      API_HOST: 0.0.0.0
      TRUSTED_PROXY_IPS: 172.30.95.2
      DATABASE_URL: postgresql://chuyu:${DB_PASSWORD}@postgres:5432/member_platform?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOAD_DIR: /app/apps/api/uploads
      MINIAPP_LOGIN_MODE: real
      WECHAT_MINIAPP_APP_ID: ${WECHAT_MINIAPP_APP_ID}
      WECHAT_MINIAPP_APP_SECRET: ${WECHAT_MINIAPP_APP_SECRET}
      POSPAL_ENABLED: ${POSPAL_ENABLED:-false}
      POSPAL_MEMBER_SYNC_ENABLED: ${POSPAL_MEMBER_SYNC_ENABLED:-false}
      POSPAL_ACCOUNT_SOURCE: ${POSPAL_ACCOUNT_SOURCE:-local}
      POSPAL_APP_ID: ${POSPAL_APP_ID:-}
      POSPAL_APP_KEY: ${POSPAL_APP_KEY:-}
      POSPAL_ACCOUNT: ${POSPAL_ACCOUNT:-}
    volumes:
      - uploads-data:/app/apps/api/uploads
    networks:
      default:
      proxy:
        ipv4_address: 172.30.95.3
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  migration:
    image: ${COMPOSE_PROJECT_NAME:-chuyu-app}-api
    profiles: ['tools']
    environment:
      DATABASE_URL: postgresql://chuyu:${DB_PASSWORD}@postgres:5432/member_platform?schema=public
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: moonisle-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-www.moonisle.shop}
    networks:
      proxy:
        ipv4_address: 172.30.95.2
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *default-logging

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.95.0/29

volumes:
  postgres-data:
    name: moonisle-postgres-data
  uploads-data:
    name: moonisle-uploads-data
  caddy-data:
    name: moonisle-caddy-data
  caddy-config:
    name: moonisle-caddy-config
