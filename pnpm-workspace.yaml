packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  core-js: true
  core-js-pure: true
  esbuild: true
  prisma: true
  unrs-resolver: true

overrides:
  '@babel/plugin-transform-modules-systemjs': 7.29.4
  '@hono/node-server': 1.19.13
  '@intlify/core-base@9.1.9': 9.14.5
  '@intlify/message-resolver@9.1.9': 9.1.11
  '@vueuse/core': 11.3.0
  '@vueuse/shared': 11.3.0
  cookie: 0.7.2
  fast-uri: 3.1.2
  follow-redirects: 1.16.0
  form-data: 4.0.6
  hono: 4.12.25
  jpeg-js: 0.4.4
  'path-to-regexp@0.1.10': 0.1.13
  phin: 3.7.1
  postcss: 8.5.10
  qs: 6.15.2
  'send@0.18.0': 0.19.0
  shell-quote: 1.9.0
  ws: 8.21.0
